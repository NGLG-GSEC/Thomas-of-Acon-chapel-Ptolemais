<style>
/* Layout: a ledger book — slim header with language/mode controls, tab strip, then one working sheet per tab */
:root{
  --bg:#f2f4f8; --surface:#ffffff; --sunk:#e8ecf3; --ink:#18223a; --muted:#5d6880; --line:#d5dbe6;
  --navy:#1f3866; --navy-ink:#ffffff; --bronze:#9a6a2c; --bronze-soft:#f3e7d6;
  --good:#1f7a4d; --good-soft:#dff1e7; --bad:#b0362c; --bad-soft:#f8e1de; --warn:#9a6200; --warn-soft:#fbefd6;
  --display:"Literata", "Noto Serif", Georgia, serif;
  --body:"Noto Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e1524; --surface:#16203a; --sunk:#1c2846; --ink:#e6ebf4; --muted:#9aa6bf; --line:#2b3a5c;
  --navy:#3b5d9c; --navy-ink:#ffffff; --bronze:#d9a362; --bronze-soft:#3a2d1c;
  --good:#5cc995; --good-soft:#173a2b; --bad:#f08a7e; --bad-soft:#47201c; --warn:#f0bd5c; --warn-soft:#3d2f12;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0e1524; --surface:#16203a; --sunk:#1c2846; --ink:#e6ebf4; --muted:#9aa6bf; --line:#2b3a5c;
  --navy:#3b5d9c; --navy-ink:#ffffff; --bronze:#d9a362; --bronze-soft:#3a2d1c;
  --good:#5cc995; --good-soft:#173a2b; --bad:#f08a7e; --bad-soft:#47201c; --warn:#f0bd5c; --warn-soft:#3d2f12;
  color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;margin:0}
.wrap{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:18px 60px}
header.top{display:flex;flex-wrap:wrap;align-items:center;gap:14px 20px;justify-content:space-between}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand svg{flex:none;width:40px;height:40px}
.brand h1{font-family:var(--display);font-weight:650;font-size:1.45rem;margin:0;line-height:1.15;text-wrap:balance}
.brand .sub{color:var(--muted);font-size:.85rem}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;color:var(--ink);padding:6px 12px;font:600 .82rem var(--body);letter-spacing:.04em;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--navy);color:var(--navy-ink)}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:.85rem;color:var(--muted);cursor:pointer;user-select:none}
.toggle input{width:18px;height:18px;accent-color:var(--bronze)}
nav.tabs{display:flex;gap:4px;margin-top:18px;border-bottom:2px solid var(--line);overflow-x:auto;scrollbar-width:thin}
nav.tabs button{flex:none;border:0;background:transparent;color:var(--muted);padding:10px 14px;font:600 .92rem var(--body);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--bronze)}
nav.tabs .num{display:inline-block;color:var(--bronze);font-family:var(--display);margin-right:6px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--bronze);outline-offset:2px}
main{margin-top:22px;display:grid;gap:22px}
h2{font-family:var(--display);font-weight:650;font-size:1.3rem;margin:0;text-wrap:balance}
h3{font-family:var(--display);font-weight:500;font-size:1.08rem;margin:0 0 10px}
.lede{color:var(--muted);margin:4px 0 0;max-width:68ch}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px}
.sheet-head{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:flex-end;justify-content:space-between;margin-bottom:14px}
.eyebrow{text-transform:uppercase;letter-spacing:.09em;font-size:.72rem;font-weight:700;color:var(--bronze)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:22px}
.grid2>*{min-width:0}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th.r,td.r{text-align:right}
tr.sum td{border-top:2px solid var(--ink);border-bottom:0;font-weight:700;padding-top:10px}
tr.sub td{background:var(--sunk);font-weight:600}
td.idx{color:var(--bronze);font-family:var(--display);width:2.2em}
td.lbl{min-width:180px}
.note{color:var(--muted);font-size:.82rem}
input[type=number],input[type=text],select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 7px;width:100%}
input[type=number]{text-align:right;max-width:110px;font-variant-numeric:tabular-nums}
input.w-s{max-width:76px}
input.name{min-width:220px}
input.txt{min-width:120px}
textarea{min-height:120px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.8rem}
.out{font-weight:600;white-space:nowrap}
.cur{font-size:.75rem;color:var(--muted);margin-left:4px}
.calc{color:var(--navy)}
:root[data-theme="dark"] .calc{color:#9fbcf0}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .calc{color:#9fbcf0}}
.flag{display:inline-block;margin-left:6px;font-size:.7rem;font-weight:700;padding:1px 6px;border-radius:999px;background:var(--warn-soft);color:var(--warn);cursor:help;vertical-align:middle}
.chip{display:inline-block;font-size:.75rem;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.result{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between;margin-top:14px;padding:12px 14px;border-radius:8px}
.result.pos{background:var(--good-soft);color:var(--good)}
.result.neg{background:var(--bad-soft);color:var(--bad)}
.result .big{font-family:var(--display);font-size:1.5rem;font-weight:650}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:14px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;gap:4px;align-content:start}
.tile .k{font-size:.78rem;color:var(--muted);font-weight:600}
.tile .v{font-family:var(--display);font-size:1.45rem;font-weight:650;font-variant-numeric:tabular-nums}
.tile .s{font-size:.8rem;color:var(--muted)}
.tile.go{cursor:pointer}
.tile.go:hover{border-color:var(--bronze)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:12px 16px}
.form label{display:grid;gap:4px;font-size:.8rem;color:var(--muted);font-weight:600}
.form input[type=number]{max-width:none;text-align:left}
.btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:7px;padding:7px 12px;font:600 .85rem var(--body);cursor:pointer}
.btn.primary{background:var(--navy);border-color:var(--navy);color:var(--navy-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.icon{padding:3px 9px;font-size:1rem;line-height:1;color:var(--muted)}
.btn:hover{border-color:var(--bronze)}
.callout{border:1px solid var(--warn);background:var(--warn-soft);color:var(--ink);border-radius:8px;padding:12px 14px}
.callout ul{margin:6px 0 0;padding-left:18px}
.callout li{margin:4px 0}
.callout b{color:var(--warn)}
.status{font-size:.82rem;color:var(--good);min-height:1.2em}
dl.tariff{display:grid;grid-template-columns:1fr auto;gap:6px 14px;margin:0;align-items:center}
dl.tariff dt{font-size:.9rem}
dl.tariff dd{margin:0;text-align:right}
dl.tariff .tot{border-top:2px solid var(--ink);padding-top:8px;font-weight:700}
.muted{color:var(--muted)}
@media (max-width:560px){ .brand h1{font-size:1.2rem} .sheet{padding:14px} }
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

/* Per-year structural differences that exist in the Excel */
const YEAR_CFG = {
  y1:{ joinSource:"affChapel", rentIncludesJoiners:false, joinExpenseLines:false },
  y2:{ joinSource:"founderDues", rentIncludesJoiners:true,  joinExpenseLines:true }
};

const nz = v => (typeof v === "number" && isFinite(v)) ? v : 0;

/* ===================== CALCULATION ENGINE ===================== */
function compute(s, excel){
  const r = {};
  const gbp = nz(s.settings.gbp);
  const toEur = (v,cur) => nz(v) * (cur === "GBP" ? gbp : 1);

  /* --- Inventory (sheet "Inventory") --- */
  let bought = 0, made = 0;
  s.inv.forEach((it,i) => {
    const has = it.qty != null || it.unit != null;
    const b = has ? (it.qty == null ? 1 : it.qty) * nz(it.unit) : null;
    r["inv."+i+".bought"] = b;
    bought += nz(b); made += nz(it.made);
  });
  r["inv.bought"] = bought; r["inv.made"] = made; r["inv.total"] = bought + made;

  /* --- Consecration budget (sheet "Consecration Budget") --- */
  const c = s.cons, pet = nz(c.pet);
  const per = v => pet ? v / pet : 0;
  let feeT = 0, feeP = 0;
  c.fees.forEach((f,i) => {
    const ue = toEur(f.unit, f.cur), q = f.link ? pet : nz(f.qty), t = ue * q, p = per(t);
    r[`cons.fee.${i}.eur`] = ue; r[`cons.fee.${i}.qty`] = q; r[`cons.fee.${i}.total`] = t; r[`cons.fee.${i}.per`] = p;
    feeT += t; feeP += p;
  });
  r["cons.fees.total"] = feeT; r["cons.fees.per"] = feeP;
  let exT = 0, exP = 0;
  c.extras.forEach((x,i) => {
    let ue = toEur(x.unit, x.cur);
    if (x.key === "furn" && s.settings.linkFurniture) ue = r["inv.total"];
    const q = nz(x.qty);
    let t, p;
    if (x.incl){ t = 0; p = 0; }
    else if (excel){ t = x.excelE === "unitXqty" ? ue * q : ue; p = per(t * q); }   /* Excel: G = E × D / petitioners */
    else { t = ue * q; p = per(t); }
    r[`cons.x.${i}.eur`] = ue; r[`cons.x.${i}.total`] = t; r[`cons.x.${i}.per`] = p;
    exT += t; exP += p;
  });
  r["cons.total"] = feeT + exT; r["cons.per"] = feeP + exP;
  r["cons.balance"] = nz(c.received) - (feeT + exT) ;

  /* --- Year budgets (sheets "Budget 1er Année", "Budget 2ème Année") --- */
  ["y1","y2"].forEach(k => {
    const y = s[k], cfg = YEAR_CFG[k], t = y.tariffs, P = k + ".";
    const recT = ["gmc","prov","chapel","diploma","kit","ritual","constb","provBy","chapBy","gloves","ship"].reduce((a,f)=>a+nz(t.rec[f]),0);
    const affSum = nz(t.aff.gmc) + nz(t.aff.prov) + nz(t.aff.chapel);
    const affT = (excel && t.aff.fixed != null) ? t.aff.fixed : affSum;
    r[P+"rec.total"] = recT; r[P+"aff.total"] = affT;

    const m = nz(y.members), j = nz(y.joiners), rc = nz(y.receptions);
    const duesRate = nz(t.dues.fm);

const L = () => S.settings.lang;
function t(k, vars){
  let s = (T[L()] && T[L()][k]) ?? T.en[k] ?? k;
  const v = Object.assign({c:S.settings.chapel, p:S.settings.province, y1:S.settings.year1, y2:S.settings.year2}, vars||{});
  return typeof s === "string" ? s.replace(/\{(\w+)\}/g,(m,x)=> v[x] ?? m) : s;
}
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function fmt(v, dec){
  if (v == null || !isFinite(v)) return "—";
  return new Intl.NumberFormat(LOCALE[L()], {minimumFractionDigits:dec??2, maximumFractionDigits:dec??2}).format(v);
}
const money = v => (v==null||!isFinite(v)) ? "—" : new Intl.NumberFormat(LOCALE[L()],{style:"currency",currency:"EUR"}).format(v);

function getP(path){ return path.split(".").reduce((o,k)=> o==null?undefined:o[k], S); }
function setP(path, val){
  const ks = path.split("."); let o = S;
  for (let i=0;i<ks.length-1;i++) o = o[ks[i]];
  o[ks[ks.length-1]] = val;
}

/* ===================== RENDER + RECALC ===================== */
function render(){
  document.documentElement.lang = L();
  document.querySelectorAll("#langSeg button").forEach(b=> b.setAttribute("aria-pressed", b.dataset.lang===L()));
  document.getElementById("excelMode").checked = !!S.settings.excelMode;
  document.getElementById("excelModeLbl").textContent = t("excelMode");
  document.getElementById("appSub").textContent = t("sub");
  renderTabs();
  const v = [vOverview, vInventory, vConsecration, ()=>vYear("y1"), ()=>vYear("y2")][tab]();
  document.getElementById("main").innerHTML = v;
  wire();
  recalc();
}

function recalc(){
  R = compute(S, !!S.settings.excelMode);
  ALT = compute(S, !S.settings.excelMode);
  ["y1","y2"].forEach(k=>{ R[k+".mcount"] = S[k].members; R[k+".jcount"] = S[k].joiners; ALT[k+".mcount"]=R[k+".mcount"]; ALT[k+".jcount"]=R[k+".jcount"]; });
  R["cons.balanceDue"] = R["cons.total"] - (Number(S.cons.received)||0); ALT["cons.balanceDue"] = ALT["cons.total"] - (Number(S.cons.received)||0);
  document.querySelectorAll("[data-k]").forEach(el=>{
    const k = el.dataset.k, f = el.dataset.f, v = R[k], a = ALT[k];
    const show = x => f==="int" ? fmt(x,0) : f==="money" ? money(x) : fmt(x);
    el.textContent = show(v);
    if (v != null && a != null && Math.abs(v - a) > 1e-9){
      const fl = document.createElement("span");
      fl.className = "flag"; fl.textContent = "⚠";
      fl.title = S.settings.excelMode ? t("flagCorr",{v:show(a)}) : t("flagTip",{v:show(a)});
      el.appendChild(fl);
    }
  });
  document.querySelectorAll("[data-sign]").forEach(el=>{ const v = R[el.dataset.sign]; el.classList.toggle("pos", v>=0); el.classList.toggle("neg", v<0); });
  const tpl = {
    s_inv: ()=> t("s_inv",{b:money(R["inv.bought"]), m:money(R["inv.made"])}),
    s_y1: ()=> t("s_y",{r:money(R["y1.rev.total"]), e:money(R["y1.exp.total"])}),
    s_y2: ()=> t("s_y",{r:money(R["y2.rev.total"]), e:money(R["y2.exp.total"])})
  };
  document.querySelectorAll("[data-tpl]").forEach(el=> el.textContent = tpl[el.dataset.tpl]());
  const d = document.getElementById("diffs");
  if (d){
    const ex = compute(S,true), co = compute(S,false);
    const gi = S.cons.extras.findIndex(x=>x.key==="guests");
    d.innerHTML = `<h3 style="margin-bottom:4px">${t("diffs_title")}</h3><p class="note" style="margin:0">${t("diffs_lede")}</p><ul>
      <li>${t("d1",{a:money(ex[`cons.x.${gi}.per`]), b:money(co[`cons.x.${gi}.per`])})}</li>
      <li>${t("d2",{a:money(ex["y1.rev.join"]), b:money(co["y1.rev.join"])})}</li>
      <li>${t("d3",{b:money(co["y2.aff.total"])})}</li></ul>`;
  }
}

let saveTimer;
function onEdit(e){
  const el = e.target, p = el.dataset.p; if (!p) return;
  let v;
  if (el.dataset.t === "num"){ const s = el.value.trim().replace(",","."); v = s === "" ? null : parseFloat(s); if (s !== "" && !isFinite(v)) return; }
  else if (el.dataset.t === "bool") v = el.checked;
  else v = el.value;
  setP(p, v);
  clearTimeout(saveTimer); saveTimer = setTimeout(save, 250);
  const structural = /^settings\.(chapel|province|year1|year2|linkFurniture)$|^cons\.pet$/.test(p) || el.tagName === "SELECT";
  if (structural && (e.type === "change")) { save(); render(); } else recalc();
}

function status(msg){ const s = document.getElementById("status"); if (s){ s.textContent = msg; setTimeout(()=>{ if(s.textContent===msg) s.textContent=""; }, 3500); } }

function wire(){
  const m = document.getElementById("main");
  m.querySelectorAll("[data-p]").forEach(el=>{ el.addEventListener("input", onEdit); el.addEventListener("change", onEdit); });
  m.querySelectorAll("[data-go]").forEach(el=> el.addEventListener("click", ()=> go(+el.dataset.go)));
  m.querySelectorAll("[data-del]").forEach(el=> el.addEventListener("click", ()=>{ S.inv.splice(+el.dataset.del,1); save(); render(); }));
  const add = document.getElementById("bAdd");
  if (add) add.addEventListener("click", ()=>{ const nums = S.inv.map(x=>parseInt(x.n,10)).filter(n=>!isNaN(n)); S.inv.push({n:String((nums.length?Math.max(...nums):0)+1), en:"", fr:"", el:"", qty:null, unit:null, made:null, by:"", note:""}); save(); render(); });
  const bc = document.getElementById("bCopy");
  if (bc){
    const box = document.getElementById("jsonBox");
    bc.addEventListener("click", ()=>{ const j = JSON.stringify(S,null,1); box.value = j;
      try { navigator.clipboard.writeText(j).then(()=>status(t("copied")), ()=>{ box.select(); }); } catch(e){ box.select(); } });
    document.getElementById("bDl").addEventListener("click", ()=>{
      const j = JSON.stringify(S,null,1); box.value = j;
      try { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([j],{type:"application/json"}));
        const d = new Date(), p2 = n=>String(n).padStart(2,"0");
        a.download = `Chap_${(S.settings.chapel||"Chapel").replace(/\W+/g,"_")}_Budget_${p2(d.getDate())}${p2(d.getMonth()+1)}${String(d.getFullYear()).slice(2)}_v1.json`;
        document.body.appendChild(a); a.click(); a.remove(); } catch(e){}
    });
    document.getElementById("fileIn").addEventListener("change", ev=>{
      const f = ev.target.files[0]; if (!f) return; const rd = new FileReader();
      rd.onload = ()=> loadJSON(rd.result); rd.readAsText(f);
    });
    document.getElementById("bApply").addEventListener("click", ()=> loadJSON(box.value));
    document.getElementById("bReset").addEventListener("click", ()=>{
      const rb = document.getElementById("resetBox");
      rb.innerHTML = `<span class="note">${t("reset_q")}</span> <button class="btn danger" type="button" id="bYes">${t("yes")}</button> <button class="btn" type="button" id="bNo">${t("no")}</button>`;
      document.getElementById("bYes").onclick = ()=>{ const lang = L(); S = defaults(); S.settings.lang = lang; save(); render(); status(t("resetDone")); };
      document.getElementById("bNo").onclick = ()=> render();
    });
  }
}
function loadJSON(txt){
  try { const o = JSON.parse(txt); if (!o || o.v !== 1 || !o.cons || !o.y1) throw 0; S = merge(defaults(), o); save(); render(); status(t("loaded")); }
  catch(e){ status(t("bad")); }
}
function go(i){ tab = i; try{ localStorage.setItem(KEY+"-tab", i); }catch(e){} render(); window.scrollTo({top:0}); }

document.getElementById("tabs").addEventListener("click", e=>{ const b = e.target.closest("[data-tab]"); if (b) go(+b.dataset.tab); });
document.getElementById("langSeg").addEventListener("click", e=>{ const b = e.target.closest("[data-lang]"); if (!b) return; S.settings.lang = b.dataset.lang; save(); render(); });
document.getElementById("excelMode").addEventListener("change", e=>{ S.settings.excelMode = e.target.checked; save(); render(); });
render();
</script>
